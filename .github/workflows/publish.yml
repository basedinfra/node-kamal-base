name: Publish image

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          MAJOR=${VERSION%%.*}
          DATE=$(date -u +%Y%m%d)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER}/node-kamal-base"
          {
            echo "tags<<EOF"
            echo "${REPO}:${VERSION}"
            echo "${REPO}:${MAJOR}"
            echo "${REPO}:${MAJOR}.${DATE}"
            echo "EOF"
            echo "primary=${REPO}:${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: |
          docker run --rm \
            -v "$PWD/test/smoke.sh:/smoke.sh:ro" \
            smoke-test:latest \
            bash /smoke.sh

      - name: Build + push multi-arch
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify multi-arch manifest
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.primary }}"
