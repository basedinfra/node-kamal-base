name: Weekly rebuild

# Refresh the :v1 moving tag with current upstream base image + apk security patches.
# `no-cache: true` is intentional — without it the apk layer would be served from
# cache and we'd ship stale packages.

on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          DATE=$(date -u +%Y%m%d)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER}/node-kamal-base"
          {
            echo "tags<<EOF"
            echo "${REPO}:v1"
            echo "${REPO}:v1.${DATE}"
            echo "EOF"
            echo "primary=${REPO}:v1"
          } >> "$GITHUB_OUTPUT"

      - name: Build amd64 for smoke test (no cache, force fresh packages)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke-test:latest
          no-cache: true
          pull: true

      - name: Run smoke test
        run: |
          docker run --rm \
            -v "$PWD/test/smoke.sh:/smoke.sh:ro" \
            smoke-test:latest \
            bash /smoke.sh

      - name: Build + push multi-arch
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          no-cache: true
          pull: true
          provenance: true
          sbom: true

      - name: Verify multi-arch manifest
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.primary }}"
